<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>料理記録</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap');

  :root {
    --paper: #eae6da;
    --paper-card: #f4f1e8;
    --ink: #2b3a42;
    --ink-light: #6b7880;
    --line: #c7bfa9;
    --stamp: #a5432f;
    --tape: #ddd2b3;
    --sage: #6b7a5e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
  }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
  }
  img { max-width: 100%; height: auto; }
  .serif { font-family: 'Shippori Mincho', serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  header { padding: 28px 16px 16px; }
  @media (min-width: 480px) { header { padding: 40px 24px 20px; } }
  @media (min-width: 768px) { header { padding: 40px 48px 20px; } }
  .eyebrow { font-size: 11px; letter-spacing: 0.1em; color: var(--ink-light); margin: 0; }
  h1 { font-size: 26px; margin: 4px 0 8px; }
  @media (min-width: 480px) { h1 { font-size: 32px; } }
  .sub { font-size: 13px; color: var(--ink-light); margin: 0; line-height: 1.5; }
  @media (min-width: 480px) { .sub { font-size: 14px; } }

  .add-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--ink); color: var(--paper-card);
    border: none; padding: 10px 16px; border-radius: 3px;
    font-family: inherit; font-size: 14px; cursor: pointer;
  }

  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%; cursor: pointer; flex-shrink: 0;
    transition: transform 0.1s ease;
  }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn-photo {
    width: 56px; height: 56px; font-size: 24px;
    background: var(--ink); color: var(--paper-card); border: none;
    box-shadow: 2px 3px 0 rgba(43,58,66,0.12);
  }
  .icon-btn-add {
    width: 38px; height: 38px; font-size: 17px;
    background: transparent; color: var(--ink-light); border: 1px solid var(--line);
  }
  .icon-btn-add-photo {
    width: 44px; height: 44px; font-size: 18px;
    background: transparent; color: var(--ink-light); border: 1px dashed var(--line);
  }
  .photo-row { display: flex; align-items: center; gap: 10px; }
  .photo-preview-wrap.compact { margin: 0; padding: 3px; }
  .photo-preview-wrap.compact img { max-height: 52px; max-width: 80px; }

  /* 右下固定のFAB（写真追加が主な操作のため、常に親指で押せる位置に） */
  .fab-stack {
    position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 50;
  }
  .fab {
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; border: none; cursor: pointer; flex-shrink: 0;
    transition: transform 0.1s ease; box-shadow: 0 4px 14px rgba(43,58,66,0.28);
  }
  .fab:active { transform: scale(0.93); }
  .fab-camera { width: 60px; height: 60px; font-size: 26px; background: var(--ink); color: var(--paper-card); }
  .fab-paste { width: 46px; height: 46px; font-size: 18px; background: var(--paper-card); color: var(--sage); border: 1px solid var(--sage); box-shadow: 0 2px 8px rgba(43,58,66,0.18); }

  .ingredient-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .ingredient-input {
    flex: 1; min-width: 0; padding: 7px 9px; border: 1px solid var(--line);
    border-radius: 3px; background: transparent; font-family: inherit; font-size: 13px; color: var(--ink);
  }
  .ingredient-del { background: none; border: none; color: var(--ink-light); cursor: pointer; font-size: 15px; padding: 2px 4px; flex-shrink: 0; }
  .ingredient-del:hover { color: var(--stamp); }
  .add-ingredient-btn { margin-top: 2px; font-size: 12px; padding: 6px 10px; }

  .entry-ingredients { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 6px; }
  .ing-chip {
    display: inline-block; font-size: 11px; color: var(--sage); border: 1px solid var(--sage);
    border-radius: 10px; padding: 1px 8px; background: rgba(107,122,94,0.07); white-space: nowrap;
  }
  .shop-chip { color: var(--stamp); border-color: var(--stamp); background: rgba(165,67,47,0.07); }
  .entry-steps { margin: 0; padding-left: 18px; font-size: 12px; color: var(--ink-light); line-height: 1.5; }
  @media (min-width: 480px) { .entry-steps { font-size: 13px; } }
  .entry-steps li { margin-bottom: 2px; }

  .card {
    background: var(--paper-card); border: 1px solid var(--line);
    box-shadow: 2px 3px 0 rgba(43,58,66,0.06);
    border-radius: 3px;
  }

  #form-panel { max-width: 480px; padding: 16px; display: none; margin-top: 4px; }
  @media (min-width: 480px) { #form-panel { padding: 20px 24px; } }
  .form-row { margin-bottom: 16px; }
  .form-row label { display: block; font-size: 12px; color: var(--ink-light); margin-bottom: 4px; }
  .form-row input[type="text"],
  .form-row input[type="datetime-local"],
  .form-row textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 3px; background: transparent; font-family: inherit; font-size: 14px; color: var(--ink);
  }
  .form-row textarea { resize: none; }
  .btn-outline {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: transparent; color: var(--ink);
    padding: 8px 12px; border-radius: 3px; font-family: inherit; font-size: 13px; cursor: pointer;
    white-space: nowrap;
  }
  .btn-sage { border-color: var(--sage); color: var(--sage); }
  .btn-save {
    width: 100%; background: var(--ink); color: var(--paper-card);
    border: none; padding: 10px; border-radius: 3px; font-family: inherit; font-size: 14px; cursor: pointer;
  }
  .btn-save:disabled, .btn-outline:disabled { opacity: 0.6; cursor: default; }
  .title-row { display: flex; gap: 8px; }
  .title-row input { flex: 1; min-width: 0; }
  .hint { font-size: 12px; color: var(--ink-light); margin: 4px 0 0; }
  .error-text { font-size: 12px; color: var(--stamp); margin: 0 0 12px; }
  .close-btn { background: none; border: none; color: var(--ink-light); cursor: pointer; font-size: 16px; }
  .form-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }

  .day-siblings-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px dashed var(--line); }
  .day-sibling-item {
    flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 3px;
    cursor: pointer; border: none; background: none; padding: 0; font-family: inherit; opacity: 0.55;
  }
  .day-sibling-item.active { opacity: 1; }
  .day-sibling-thumb, .day-sibling-thumb-placeholder {
    width: 40px; height: 40px; border-radius: 2px; box-sizing: border-box; border: 2px solid transparent;
  }
  .day-sibling-thumb { object-fit: cover; display: block; }
  .day-sibling-thumb-placeholder { display: flex; align-items: center; justify-content: center; background: var(--paper); font-size: 16px; }
  .day-sibling-item.active .day-sibling-thumb,
  .day-sibling-item.active .day-sibling-thumb-placeholder { border-color: var(--sage); }
  .day-sibling-time { font-size: 10px; color: var(--ink-light); }

  .mode-toggle { display: flex; gap: 0; margin-bottom: 14px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .mode-toggle-btn {
    flex: 1; font-family: inherit; font-size: 13px; padding: 9px 8px; cursor: pointer;
    border: none; background: transparent; color: var(--ink-light);
  }
  .mode-toggle-btn + .mode-toggle-btn { border-left: 1px solid var(--line); }
  .mode-toggle-btn.active { background: var(--ink); color: var(--paper-card); }

  .photo-preview-wrap { display: inline-block; max-width: 100%; padding: 4px; background: var(--tape); transform: rotate(-1.5deg); margin: 8px 0 16px; }
  .photo-preview-wrap img { display: block; width: auto; max-width: 100%; max-height: 160px; border-radius: 2px; }

  main { padding: 16px 4px 140px; }
  @media (min-width: 480px) { main { padding: 16px 8px 140px; } }
  @media (min-width: 768px) { main { padding: 16px 48px 140px; } }
  #empty-msg, #loading-msg { font-size: 14px; color: var(--ink-light); padding: 0 16px; }

  .holes {
    background-image: radial-gradient(circle, var(--line) 3px, transparent 3px);
    background-size: 100% 34px; background-position: 4px 10px;
    padding-left: 12px;
  }
  @media (min-width: 480px) { .holes { padding-left: 22px; background-position: 8px 10px; } }
  @media (min-width: 768px) { .holes { padding-left: 40px; } }
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; padding-top: 8px; }
  @media (min-width: 768px) { .grid { grid-template-columns: 1fr 1fr; gap: 16px; } }

  .view-toggle { display: flex; gap: 8px; padding: 0 16px 4px; }
  @media (min-width: 480px) { .view-toggle { padding: 0 24px 4px; } }
  @media (min-width: 768px) { .view-toggle { padding: 0 48px 4px; } }
  .view-toggle-btn {
    font-family: inherit; font-size: 12px; padding: 5px 12px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--ink-light);
  }
  .view-toggle-btn.active { background: var(--ink); color: var(--paper-card); border-color: var(--ink); }

  .date-group { margin-bottom: 8px; }
  .date-heading {
    font-size: 13px; color: var(--ink-light); margin: 20px 0 8px; padding-bottom: 4px;
    border-bottom: 1px solid var(--line);
  }
  .date-group:first-child .date-heading { margin-top: 4px; }

  .top-actions { padding: 0 16px 4px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:flex-end; }
  @media (min-width: 480px) { .top-actions { padding: 0 24px 4px; } }
  .detail-add-link {
    font-family: inherit; font-size: 12px; color: var(--ink-light); background: none; border: none;
    cursor: pointer; text-decoration: underline; text-underline-offset: 2px; padding: 6px 4px;
  }
  #form-anchor { padding: 0 16px; }
  @media (min-width: 480px) { #form-anchor { padding: 0 24px; } }

  .entry { padding: 12px; position: relative; cursor: pointer; }
  @media (min-width: 480px) { .entry { padding: 16px; } }
  .entry:active { background: #ece7d8; }
  .stamp-row { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .stamp {
    transform: rotate(-2deg);
    border: 2px solid var(--stamp); color: var(--stamp); background: var(--paper-card);
    font-size: 11px; padding: 3px 7px; border-radius: 3px; white-space: nowrap; line-height: 1.3;
  }
  .entry-body { display: flex; gap: 10px; }
  @media (min-width: 480px) { .entry-body { gap: 12px; } }
  .thumb-wrap { flex-shrink: 0; padding: 3px; background: var(--tape); transform: rotate(-2deg); }
  .thumb-wrap img { width: 64px; height: 64px; object-fit: cover; border-radius: 2px; display: block; cursor: zoom-in; }
  @media (min-width: 480px) { .thumb-wrap img { width: 76px; height: 76px; } }
  .thumb-placeholder {
    width: 64px; height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    border: 1px dashed var(--line); color: var(--ink-light); border-radius: 2px; font-size: 20px;
  }
  @media (min-width: 480px) { .thumb-placeholder { width: 76px; height: 76px; font-size: 22px; } }
  .entry-title { font-size: 15px; margin: 0 0 4px; word-break: break-word; }
  @media (min-width: 480px) { .entry-title { font-size: 16px; } }
  .entry-comment { font-size: 12px; color: var(--ink-light); margin: 0; line-height: 1.4; word-break: break-word; }
  @media (min-width: 480px) { .entry-comment { font-size: 13px; } }
  .entry-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
  .del-btn { position: static; background: none; border: none; color: var(--ink-light); opacity: 0.75; cursor: pointer; font-size: 12px; padding: 4px 0; }
  .del-btn:hover { opacity: 1; }
  .spin { display: inline-block; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #lightbox {
    display: none; position: fixed; inset: 0; background: rgba(20,22,20,0.88);
    z-index: 1000; align-items: center; justify-content: center; padding: 24px; cursor: zoom-out;
  }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 4px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
  #lightbox-close { position: fixed; top: 16px; right: 20px; color: #fff; font-size: 26px; background: none; border: none; cursor: pointer; z-index: 1001; }
</style>
</head>
<body>

<header>
  <p class="eyebrow mono">KITCHEN LOG / ネタ帳</p>
  <h1 class="serif">料理記録</h1>
</header>

<div class="top-actions">
  <button class="detail-add-link" id="open-form-btn">＋ 詳しく記録する</button>
</div>

<div id="form-anchor">
  <div class="card" id="form-panel">
    <div class="form-head">
      <h2 class="serif" style="margin:0; font-size:18px;">新しい記録</h2>
      <button class="close-btn" id="close-form-btn">✕</button>
    </div>

    <div id="day-siblings-strip" class="day-siblings-strip" style="display:none;"></div>

    <div class="mode-toggle" id="mode-toggle">
      <button type="button" class="mode-toggle-btn active" id="mode-cook-btn">🍳 自炊</button>
      <button type="button" class="mode-toggle-btn" id="mode-eatout-btn">🍱 外食・惣菜</button>
    </div>

    <div class="form-row">
      <label>日付・時間</label>
      <input type="datetime-local" id="input-datetime" class="mono">
    </div>

    <div class="form-row">
      <label>タイトル</label>
      <div class="title-row">
        <input type="text" id="input-title" placeholder="例：無水きのこの炊き込みご飯">
      </div>
    </div>

    <div class="form-row">
      <label>写真</label>
      <div class="photo-row">
        <div id="photo-preview-wrap" class="photo-preview-wrap compact" style="display:none;">
          <img id="photo-preview" src="" alt="添付写真">
        </div>
        <button class="icon-btn icon-btn-add-photo" id="pick-photo-btn" aria-label="写真を選ぶ" title="写真を選ぶ">📷</button>
        <input type="file" id="file-input" accept="image/*,.heic,.heif" style="display:none;">
      </div>
    </div>

    <div id="cook-fields">
      <div class="form-row">
        <label>材料</label>
        <div id="ingredients-list"></div>
        <button type="button" class="btn-outline btn-sage add-ingredient-btn" id="add-ingredient-btn">＋ 材料を追加</button>
      </div>

      <div class="form-row">
        <label>作り方・メモ</label>
        <textarea id="input-comment" rows="6" placeholder="手順や感想を自由に（1行1手順で書くと一覧で番号付きになります）。&#10;例：フライパンで香りが出るまで炒める&#10;出汁を加えて10分煮る"></textarea>
      </div>
    </div>

    <div id="eatout-fields" style="display:none;">
      <div class="form-row">
        <label>店名</label>
        <input type="text" id="input-shop" placeholder="例：〇〇食堂、セブンイレブン">
      </div>
      <div class="form-row">
        <label>メニュー</label>
        <input type="text" id="input-menu" placeholder="例：唐揚げ弁当、天ぷらそば">
      </div>
    </div>

    <p class="error-text" id="form-error" style="display:none;"></p>

    <button class="btn-save" id="save-btn">記録を保存</button>
  </div>
</div>
<p class="error-text" id="outer-error" style="display:none; margin: 0 16px 8px;"></p>
<p class="hint" id="quick-add-status" style="display:none; margin: 0 16px 8px;"></p>

<div class="fab-stack">
  <button class="fab fab-paste" id="paste-photo-btn" aria-label="写真を貼り付け" title="写真を貼り付け">📋</button>
  <button class="fab fab-camera" id="quick-photo-btn" aria-label="写真を追加" title="写真を追加">📷</button>
</div>
<input type="file" id="quick-photo-input" accept="image/*,.heic,.heif" multiple style="display:none;">

<main>
  <p id="loading-msg">読み込み中...</p>
  <button class="btn-save" id="retry-btn" style="display:none; margin:8px 0;">再読み込み</button>
  <p id="empty-msg" style="display:none;">まだ記録がありません。最初の一皿を記録してみましょう。</p>
  <div class="view-toggle" id="view-toggle" style="display:none;">
    <button type="button" class="view-toggle-btn" data-mode="list" id="view-list-btn">一覧表示</button>
    <button type="button" class="view-toggle-btn" data-mode="grouped" id="view-grouped-btn">日付ごと</button>
  </div>
  <div class="holes" id="list-wrap" style="display:none;">
    <div id="list"></div>
  </div>
</main>

<div id="lightbox">
  <button id="lightbox-close" aria-label="閉じる">✕</button>
  <img id="lightbox-img" src="" alt="拡大写真">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.1/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://edfrjxjdzxutcjeayfac.supabase.co';
const SUPABASE_KEY = 'sb_publishable_GVtanlT_gDwSEQSsZPC_NQ_nEK-60x2';
const TABLE = 'recipe-log';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const WEEKDAYS = ["日","月","火","水","木","金","土"];
let entries = [];
let currentPhotoDataUrl = null;
let currentPhotoHash = null;
let heicLoadPromise = null;
let editingId = null;
let viewMode = 'list';
try { viewMode = localStorage.getItem('recipeLogViewMode') || 'list'; } catch (e) {}
let formMode = 'cook';

// ---- 重複検出用ハッシュ(写真データの内容からSHA-256を計算) ----
async function sha256Hex(text) {
  const bytes = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function isoToInput(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return nowForInput();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,16);
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? "" : s;
  return d.innerHTML;
}

// ---- content structuring, packed into the single `comment` field ----
// 自炊モード: 材料:/作り方: 見出し付きテキスト。 外食・惣菜モード: 店名:/メニュー: 見出し付きテキスト。
function buildComment(ingredients, stepsText) {
  const parts = [];
  if (ingredients.length) {
    parts.push('材料:\n' + ingredients.map(i => '・' + i).join('\n'));
  }
  if (stepsText.trim()) {
    parts.push('作り方:\n' + stepsText.trim());
  }
  return parts.join('\n\n');
}

function buildEatoutComment(shopName, menuItem) {
  return `店名: ${shopName.trim()}\nメニュー: ${menuItem.trim()}`;
}

function parseComment(comment) {
  const empty = { mode: 'cook', ingredients: [], steps: '', shopName: '', menuItem: '' };
  if (!comment) return empty;
  const shopMatch = comment.match(/^店名:\s*([\s\S]*?)\nメニュー:\s*([\s\S]*)$/);
  if (shopMatch) {
    return { mode: 'eatout', ingredients: [], steps: '', shopName: shopMatch[1].trim(), menuItem: shopMatch[2].trim() };
  }
  const materialMatch = comment.match(/材料:\n([\s\S]*?)(?:\n\n作り方:|$)/);
  const stepsMatch = comment.match(/作り方:\n([\s\S]*)$/);
  if (materialMatch || stepsMatch) {
    const ingredients = materialMatch
      ? materialMatch[1].split('\n').map(s => s.replace(/^・/, '').trim()).filter(Boolean)
      : [];
    const steps = stepsMatch ? stepsMatch[1].trim() : '';
    return { mode: 'cook', ingredients, steps, shopName: '', menuItem: '' };
  }
  // 旧形式（構造化前の自由記述）はそのまま「作り方」として扱う
  return { mode: 'cook', ingredients: [], steps: comment, shopName: '', menuItem: '' };
}

function setFormMode(mode) {
  formMode = mode;
  document.getElementById('mode-cook-btn').classList.toggle('active', mode === 'cook');
  document.getElementById('mode-eatout-btn').classList.toggle('active', mode === 'eatout');
  document.getElementById('cook-fields').style.display = mode === 'cook' ? '' : 'none';
  document.getElementById('eatout-fields').style.display = mode === 'eatout' ? '' : 'none';
}

function addIngredientRow(value = '') {
  const wrap = document.getElementById('ingredients-list');
  const row = document.createElement('div');
  row.className = 'ingredient-row';
  row.innerHTML = `
    <input type="text" class="ingredient-input" placeholder="例：しめじ、米2合">
    <button type="button" class="ingredient-del" aria-label="削除">✕</button>
  `;
  row.querySelector('.ingredient-input').value = value;
  row.querySelector('.ingredient-del').addEventListener('click', () => {
    row.remove();
    if (!document.getElementById('ingredients-list').querySelector('.ingredient-row')) addIngredientRow('');
  });
  wrap.appendChild(row);
}

function collectIngredients() {

}

function renderRecipeDisplay(comment) {
  const parsed = parseComment(comment);
  let html = '';
  if (parsed.mode === 'eatout') {
    if (parsed.shopName) {
      html += `<div class="entry-ingredients"><span class="ing-chip shop-chip">🏮 ${esc(parsed.shopName)}</span></div>`;
    }
    if (parsed.menuItem) {
      html += `<p class="entry-comment">${esc(parsed.menuItem)}</p>`;
    }
    return html;
  }
  if (parsed.ingredients.length) {
    html += `<div class="entry-ingredients">${parsed.ingredients.map(i => `<span class="ing-chip">${esc(i)}</span>`).join('')}</div>`;
  }
  if (parsed.steps) {

}

function formatDateTime(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  const hh = String(d.getHours()).padStart(2,"0");
  const mm = String(d.getMinutes()).padStart(2,"0");
  return `${d.getMonth()+1}/${d.getDate()} (${WEEKDAYS[d.getDay()]}) ${hh}:${mm}`;
}

function nowForInput() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,16);
}

function setFormError(msg) {

// ---- HEIC handling ----
function ensureHeic2any() {
  if (window.heic2any) return Promise.resolve(window.heic2any);
  if (heicLoadPromise) return heicLoadPromise;
  heicLoadPromise = new Promise((resolve, reject) => {
    const check = () => {
      if (window.heic2any) resolve(window.heic2any);
      else setTimeout(check, 100);
    };
    check();
    setTimeout(() => { if (!window.heic2any) reject(new Error("heic2any load timeout")); }, 8000);
  });
  return heicLoadPromise;
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function resizeDataUrl(dataUrl, maxWidth = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxWidth / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

function exifDateToIso(dt) {
  const m = String(dt).match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
  if (!m) return null;
  const d = new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5], +m[6]);
  if (isNaN(d.getTime())) return null;
  return d.toISOString();
}

function getPhotoDate(file) {
  return new Promise((resolve) => {
    const fallback = () => resolve(file.lastModified ? new Date(file.lastModified).toISOString() : new Date().toISOString());
    const isHeic = /heic|heif/i.test(file.type) || /\.hei[cf]$/i.test(file.name || "");
    if (typeof EXIF === 'undefined' || isHeic) { fallback(); return; }
    try {
      EXIF.getData(file, function () {
        const dt = EXIF.getTag(this, "DateTimeOriginal") || EXIF.getTag(this, "DateTime");
        const iso = dt ? exifDateToIso(dt) : null;
        if (iso) resolve(iso); else fallback();
      });
    } catch (e) { fallback(); }
  });
}

async function processOnePhotoFile(file) {
  const isHeic = /heic|heif/i.test(file.type) || /\.hei[cf]$/i.test(file.name || "");
  const dateIso = await getPhotoDate(file);
  let dataUrl;
  if (isHeic) {
    const heic2any = await ensureHeic2any();
    const result = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.8 });
    const blob = Array.isArray(result) ? result[0] : result;
    dataUrl = await fileToDataUrl(blob);
  } else {
    dataUrl = await fileToDataUrl(file);
  }
  const resized = await resizeDataUrl(dataUrl);
  const hash = await sha256Hex(resized);
  return { datetime: dateIso, photo: resized, photoHash: hash };
}

// 既存レコードのphoto_hashを全件取得（null以外）してSetにする
async function fetchExistingPhotoHashes() {
  const { data, error } = await supabaseClient.from(TABLE).select('photo_hash').not('photo_hash', 'is', null);
  if (error) throw error;
  return new Set((data || []).map(r => r.photo_hash).filter(Boolean));
}

async function handleQuickAddPhotos(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  setOuterError("");
  const statusEl = document.getElementById('quick-add-status');
  statusEl.style.display = 'block';
  statusEl.textContent = '既存の記録と照合しています...';

  let existingHashes;
  try {
    existingHashes = await fetchExistingPhotoHashes();
  } catch (e) {
    // 照合に失敗した場合は重複チェックをスキップして続行（取り込み自体は止めない）
    existingHashes = new Set();
  }
  const batchHashes = new Set();

  let done = 0, failed = 0, duplicate = 0;
  for (const file of files) {
    statusEl.textContent = `写真を取り込み中 (${done + 1}/${files.length})...`;
    try {
      const { datetime, photo, photoHash } = await processOnePhotoFile(file);
      if (existingHashes.has(photoHash) || batchHashes.has(photoHash)) {
        duplicate++;
      } else {
        const id = `${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
        const entry = { id, datetime, title: "", comment: "", photo, photo_hash: photoHash };
        await dbPut(entry);
        entries.push(entry);
        batchHashes.add(photoHash);
      }
    } catch (e) {
      failed++;
    }
    done++;
  }
  entries.sort((a,b) => new Date(b.datetime) - new Date(a.datetime));
  renderList();
  statusEl.style.display = 'none';
  statusEl.textContent = '';
  const notes = [];
  if (duplicate > 0) notes.push(`${duplicate}件は既存と同じ写真のためスキップしました`);
  if (failed > 0) notes.push(`${failed}件は取り込めませんでした（HEIC変換の失敗など）`);
  if (notes.length) setOuterError(notes.join('。') + '。');
}

// ---- クリップボードからの貼り付け ----
async function handlePasteButton() {
  if (!navigator.clipboard || !navigator.clipboard.read) {
    setOuterError("この端末・ブラウザはボタンでの貼り付けに対応していません。写真アプリでコピー後、このページの何もない場所を長押しして「ペースト」を選んでください。");
    return;
  }
  try {
    const items = await navigator.clipboard.read();
    const files = [];
    for (const item of items) {
      for (const type of item.types) {
        if (type.startsWith('image/')) {
          const blob = await item.getType(type);
          files.push(new File([blob], `pasted-${Date.now()}.${type.split('/')[1] || 'jpg'}`, { type }));
        }
      }
    }
    if (!files.length) {
      setOuterError("クリップボードに写真が見つかりませんでした。写真アプリで画像をコピーしてから、もう一度お試しください。");
      return;
    }
    handleQuickAddPhotos(files);
  } catch (e) {
    setOuterError("クリップボードを読み取れませんでした。写真アプリで画像をコピーしてから、もう一度お試しください（権限を聞かれたら許可してください）。");
  }
}

function extractImageFilesFromClipboard(clipboardData) {
  if (!clipboardData || !clipboardData.items) return [];
  const files = [];
  for (const item of clipboardData.items) {
    if (item.kind === 'file' && item.type.startsWith('image/')) {
      const file = item.getAsFile();
      if (file) files.push(file);
    }
  }
  return files;
}

async function handleFileSelected(file) {
  setFormError("");
  const isHeic = /heic|heif/i.test(file.type) || /\.hei[cf]$/i.test(file.name || "");
  try {
    let dataUrl;

    // 写真の日付を推定して日付欄に反映(撮影日時のEXIFがなければファイルの更新日時)
    getPhotoDate(file).then(iso => {
      document.getElementById('input-datetime').value = isoToInput(iso);
    });

    if (isHeic) {
      setFormError("HEIC画像を変換しています...");
      const heic2any = await ensureHeic2any();
      const result = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.8 });
      const blob = Array.isArray(result) ? result[0] : result;
      dataUrl = await fileToDataUrl(blob);
      setFormError("");
    } else {
      dataUrl = await fileToDataUrl(file);
    }
    const resized = await resizeDataUrl(dataUrl);
    currentPhotoDataUrl = resized;
    currentPhotoHash = await sha256Hex(resized);
    document.getElementById('photo-preview').src = resized;
    document.getElementById('photo-preview-wrap').style.display = 'inline-block';
  } catch (err) {
    currentPhotoDataUrl = null;
    currentPhotoHash = null;
    document.getElementById('photo-preview-wrap').style.display = 'none';
    if (isHeic) {
      setFormError("HEIC画像の変換に失敗しました。iPhoneの「設定 > カメラ > フォーマット」を「互換性優先」にするか、JPEG/PNGとして書き出してから選び直してください。");
    } else {
      setFormError(`画像の読み込みに失敗しました（${file.type || "unknown"} / ${(file.size/1024).toFixed(0)}KB）。別の写真でお試しください。`);
    }
  }
}

// ---- storage (Supabase: PC・スマホ間で同じデータを共有) ----
// 一覧は軽い列だけ取得（写真はbase64で巨大なので別途1件ずつ読む）
async function dbGetAll() {
  const { data, error } = await supabaseClient.from(TABLE).select('id,datetime,title,comment');
  if (error) throw error;
  return data || [];
}

async function dbGetPhoto(id) {
  const { data, error } = await supabaseClient.from(TABLE).select('photo,photo_hash').eq('id', id).maybeSingle();
  if (error) throw error;
  return data || null;
}

async function withRetry(fn, tries = 3) {
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try { return await fn(); }
    catch (e) {
      lastErr = e;
      if (i < tries - 1) await new Promise(r => setTimeout(r, 1000 * (i + 1)));
    }
  }
  throw lastErr;
}

async function dbPut(entry) {
  const { error } = await supabaseClient.from(TABLE).upsert(entry);
  if (error) throw error;
  return true;
}

async function dbDelete(id) {
  const { error } = await supabaseClient.from(TABLE).delete().eq('id', id);
  if (error) throw error;
  return true;
}

// ---- realtime sync (他端末での追加・編集・削除を反映) ----
function upsertLocalEntry(row) {
  const idx = entries.findIndex(e => e.id === row.id);
  if (idx >= 0) entries[idx] = { ...entries[idx], ...row }; else entries.push(row);
  entries.sort((a,b) => new Date(b.datetime) - new Date(a.datetime));
}

function subscribeRealtime() {
  supabaseClient
    .channel('recipe-log-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: TABLE }, (payload) => {
      if (payload.eventType === 'DELETE') {
        const id = payload.old && payload.old.id;
        if (id == null) return;
        entries = entries.filter(e => e.id !== id);
      } else {
        upsertLocalEntry(payload.new);
      }
      renderList();
    })
    .subscribe();
}

async function loadEntries() {
  const msg = document.getElementById('loading-msg');
  const retryBtn = document.getElementById('retry-btn');
  msg.style.display = 'block';
  msg.textContent = '読み込み中...';
  retryBtn.style.display = 'none';
  setOuterError("");
  let ok = false;
  try {
    const items = await withRetry(dbGetAll);
    items.sort((a,b) => new Date(b.datetime) - new Date(a.datetime));
    entries = items;
    ok = true;
  } catch (e) {
    setOuterError("記録の読み込みに失敗しました。通信状況を確認して、もう一度お試しください。");
    retryBtn.style.display = 'inline-block';
  } finally {
    msg.style.display = 'none';
    renderList();
  }
  if (ok) loadPhotosInBackground();
}

// 写真を新しい順に1件ずつ読み込み、届いた分からカードに反映
async function loadPhotosInBackground() {
  for (const e of entries.slice()) {
    if (e.photo !== undefined) continue;
    try {
      const row = await withRetry(() => dbGetPhoto(e.id), 2);
      const cur = entries.find(x => x.id === e.id);
      if (!cur) continue;
      if (cur.photo === undefined) {
        cur.photo = row ? (row.photo || null) : null;
        cur.photo_hash = row ? (row.photo_hash || null) : null;
      }
      applyPhotoToCard(cur);
    } catch (err) { /* 失敗した分は未取得のまま（編集時に再取得） */ }
  }
}

function applyPhotoToCard(entry) {
  if (!entry.photo) return;
  document.querySelectorAll(`.entry[data-id="${CSS.escape(entry.id)}"]`).forEach(card => {
    const ph = card.querySelector('.thumb-placeholder');
    if (!ph) return;
    const wrap = document.createElement('div');
    wrap.className = 'thumb-wrap';
    const img = document.createElement('img');
    img.className = 'thumb-img';
    img.src = entry.photo;
    img.alt = entry.title || '';
    img.addEventListener('click', (ev) => { ev.stopPropagation(); openLightbox(img.src); });
    wrap.appendChild(img);
    ph.replaceWith(wrap);
  });
}

function entryCardHtml(e) {
  return `
    <article class="card entry" data-id="${esc(e.id)}">
      <div class="stamp-row"><span class="stamp mono">${esc(formatDateTime(e.datetime))}</span></div>
      <div class="entry-body">
        ${e.photo
          ? `<div class="thumb-wrap"><img class="thumb-img" src="${e.photo}" alt="${esc(e.title)}"></div>`
          : `<div class="thumb-placeholder">🍚</div>`}
        <div style="min-width:0; flex:1;">
          <h3 class="serif entry-title"${e.title ? '' : ' style="color:var(--ink-light); font-style:italic;"'}>${e.title ? esc(e.title) : "(タイトル未入力・タップして編集)"}</h3>
          ${e.comment ? renderRecipeDisplay(e.comment) : ``}
        </div>
      </div>
      <div class="entry-actions">
        <button class="del-btn" data-id="${esc(e.id)}">🗑 削除</button>
      </div>
    </article>
  `;
}

function formatDateHeading(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "日付不明";
  return `${d.getMonth()+1}/${d.getDate()} (${WEEKDAYS[d.getDay()]})`;
}

function groupEntriesByDate(items) {
  const groups = [];
  const indexByKey = new Map();
  items.forEach(e => {
    const d = new Date(e.datetime);
    const key = isNaN(d.getTime()) ? "unknown" : `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    if (!indexByKey.has(key)) {
      indexByKey.set(key, groups.length);
      groups.push({ key, items: [] });
    }
    groups[indexByKey.get(key)].items.push(e);
  });
  return groups;
}

function setViewMode(mode) {
  viewMode = mode;
  try { localStorage.setItem('recipeLogViewMode', mode); } catch (e) {}
  document.getElementById('view-list-btn').classList.toggle('active', mode === 'list');
  document.getElementById('view-grouped-btn').classList.toggle('active', mode === 'grouped');
  renderList();
}

function renderList() {
  const listWrap = document.getElementById('list-wrap');
  const emptyMsg = document.getElementById('empty-msg');
  const toggle = document.getElementById('view-toggle');
  const list = document.getElementById('list');
  if (entries.length === 0) {
    listWrap.style.display = 'none';
    emptyMsg.style.display = 'block';
    toggle.style.display = 'none';
    return;
  }
  emptyMsg.style.display = 'none';
  listWrap.style.display = 'block';
  toggle.style.display = 'flex';

  if (viewMode === 'grouped') {
    const groups = groupEntriesByDate(entries);
    list.innerHTML = groups.map(g => `
      <div class="date-group">
        <h2 class="date-heading serif">${esc(formatDateHeading(g.items[0].datetime))}</h2>
        <div class="grid">${g.items.map(entryCardHtml).join("")}</div>
      </div>
    `).join("");
  } else {
    list.innerHTML = `<div class="grid">${entries.map(entryCardHtml).join("")}</div>`;
  }

  list.querySelectorAll('.entry').forEach(el => {
    el.addEventListener('click', () => handleEdit(el.getAttribute('data-id')));
  });
  list.querySelectorAll('.thumb-img').forEach(img => {
    img.addEventListener('click', (ev) => {
      ev.stopPropagation();
      openLightbox(img.src);
    });
  });
  list.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      handleDelete(btn.getAttribute('data-id'));
    });
  });
}

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').style.display = 'flex';
}
function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
  document.getElementById('lightbox-img').src = '';
}

async function handleDelete(id) {
  try {
    await dbDelete(id);
    entries = entries.filter(e => e.id !== id);
    renderList();
  } catch (e) {
    setOuterError("削除に失敗しました。");
  }
}

function getSameDateEntries(entry) {
  const d = new Date(entry.datetime);
  if (isNaN(d.getTime())) return [entry];
  return entries
    .filter(e => {
      const ed = new Date(e.datetime);
      return !isNaN(ed.getTime()) && ed.getFullYear() === d.getFullYear() && ed.getMonth() === d.getMonth() && ed.getDate() === d.getDate();
    })
    .sort((a, b) => new Date(a.datetime) - new Date(b.datetime));
}

function renderDaySiblingsStrip(entry) {
  const strip = document.getElementById('day-siblings-strip');
  if (viewMode !== 'grouped') { strip.style.display = 'none'; strip.innerHTML = ''; return; }
  const siblings = getSameDateEntries(entry);
  if (siblings.length < 2) { strip.style.display = 'none'; strip.innerHTML = ''; return; }
  strip.innerHTML = siblings.map(s => `
    <button type="button" class="day-sibling-item${s.id === entry.id ? ' active' : ''}" data-id="${esc(s.id)}">
      ${s.photo ? `<img class="day-sibling-thumb" src="${s.photo}" alt="">` : `<div class="day-sibling-thumb-placeholder">🍚</div>`}
      <span class="day-sibling-time mono">${esc(formatDateTime(s.datetime).split(' ').pop())}</span>
    </button>
  `).join('');
  strip.style.display = 'flex';
  strip.querySelectorAll('.day-sibling-item').forEach(btn => {
    btn.addEventListener('click', () => handleEdit(btn.getAttribute('data-id')));
  });
}

async function handleEdit(id) {
  const entry = entries.find(e => e.id === id);
  if (!entry) return;
  // 写真が未取得のまま保存すると写真が消えるため、先に取得する
  if (entry.photo === undefined) {
    try {
      const row = await withRetry(() => dbGetPhoto(id), 2);
      entry.photo = row ? (row.photo || null) : null;
      entry.photo_hash = row ? (row.photo_hash || null) : null;
    } catch (err) {
      setOuterError("写真の読み込みに失敗したため編集を開けませんでした。少し待ってからもう一度お試しください。");
      return;
    }
    applyPhotoToCard(entry);
  }
  editingId = id;
  document.getElementById('input-datetime').value = isoToInput(entry.datetime);
  const parsed = parseComment(entry.comment || '');
  setFormMode(parsed.mode);
  if (parsed.mode === 'eatout') {
    document.getElementById('input-shop').value = parsed.shopName;
    document.getElementById('input-menu').value = parsed.menuItem;
    renderIngredientRows(['']);
    document.getElementById('input-comment').value = "";
  } else {
    renderIngredientRows(parsed.ingredients);
    document.getElementById('input-comment').value = parsed.steps;
    document.getElementById('input-shop').value = "";
    document.getElementById('input-menu').value = "";
  }
  document.getElementById('input-title').value = entry.title || "";
  currentPhotoDataUrl = entry.photo || null;
  currentPhotoHash = entry.photo_hash || null;
  if (entry.photo) {
    document.getElementById('photo-preview').src = entry.photo;
    document.getElementById('photo-preview-wrap').style.display = 'inline-block';
  } else {
    document.getElementById('photo-preview-wrap').style.display = 'none';
  }
  renderDaySiblingsStrip(entry);
  document.querySelector('#form-panel .form-head h2').textContent = '記録を編集';
  document.getElementById('save-btn').textContent = '更新する';
  document.getElementById('form-panel').style.display = 'block';
  document.getElementById('open-form-btn').style.display = 'none';
  setFormError("");
  document.getElementById('form-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function handleSave() {
  const title = document.getElementById('input-title').value.trim();
  let comment, fallbackTitle;
  if (formMode === 'eatout') {
    const shopName = document.getElementById('input-shop').value.trim();
    const menuItem = document.getElementById('input-menu').value.trim();
    comment = (shopName || menuItem) ? buildEatoutComment(shopName, menuItem) : "";
    fallbackTitle = [shopName, menuItem].filter(Boolean).join(" - ");
    if (!title && !comment && !currentPhotoDataUrl) {
      setFormError("タイトル・店名・メニュー・写真のいずれかを入力してください。");
      return;
    }
  } else {
    const ingredients = collectIngredients();
    const stepsText = document.getElementById('input-comment').value.trim();
    comment = buildComment(ingredients, stepsText);
    fallbackTitle = comment;
    if (!title && !comment && !currentPhotoDataUrl) {
      setFormError("タイトル・材料・作り方・写真のいずれかを入力してください。");
      return;
    }
  }
  const datetime = document.getElementById('input-datetime').value;
  const saveBtn = document.getElementById('save-btn');
  saveBtn.disabled = true; const origText = saveBtn.textContent; saveBtn.textContent = editingId ? '更新中...' : '保存中...';
  setFormError("");

  // 新規追加時のみ：同じ写真が既にある場合は警告する（編集時は自分自身と一致するのが普通なので対象外）
  if (!editingId && currentPhotoHash) {
    try {
      const existingHashes = await fetchExistingPhotoHashes();
      if (existingHashes.has(currentPhotoHash)) {
        const proceed = confirm("同じ写真の記録が既にあります。それでも保存しますか？");
        if (!proceed) {
          saveBtn.disabled = false; saveBtn.textContent = origText;
          return;
        }
      }
    } catch (e) { /* 確認に失敗しても保存自体は続行 */ }
  }

  const id = editingId || `${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
  const entry = {
    id,
    datetime: new Date(datetime).toISOString(),
    title: title || fallbackTitle || "無題の記録",
    comment,
    photo: currentPhotoDataUrl,
    photo_hash: currentPhotoHash
  };
  try {
    const result = await dbPut(entry);
    if (!result) throw new Error("save failed");
    if (editingId) {
      entries = entries.map(e => e.id === id ? entry : e);
    } else {
      entries.unshift(entry);
    }
    entries.sort((a,b) => new Date(b.datetime) - new Date(a.datetime));
    renderList();
    resetForm();
  } catch (e) {
    setFormError(editingId ? "更新に失敗しました。もう一度お試しください。" : "保存に失敗しました。もう一度お試しください。");
  } finally {
    saveBtn.disabled = false; saveBtn.textContent = origText;
  }
}

function resetForm() {
  editingId = null;
  setFormMode('cook');
  document.getElementById('input-datetime').value = nowForInput();
  renderIngredientRows(['']);
  document.getElementById('input-comment').value = "";
  document.getElementById('input-shop').value = "";
  document.getElementById('input-menu').value = "";
  document.getElementById('input-title').value = "";
  currentPhotoDataUrl = null;
  currentPhotoHash = null;
  document.getElementById('photo-preview-wrap').style.display = 'none';
  document.getElementById('file-input').value = "";
  document.getElementById('day-siblings-strip').style.display = 'none';
  document.getElementById('day-siblings-strip').innerHTML = '';
  document.getElementById('form-panel').style.display = 'none';
  document.getElementById('open-form-btn').style.display = 'inline-flex';
  document.querySelector('#form-panel .form-head h2').textContent = '新しい記録';
  document.getElementById('save-btn').textContent = '記録を保存';
  setFormError("");
}

// ---- wire up ----
document.getElementById('input-datetime').value = nowForInput();
renderIngredientRows(['']);
document.getElementById('add-ingredient-btn').addEventListener('click', () => addIngredientRow(''));
document.getElementById('mode-cook-btn').addEventListener('click', () => setFormMode('cook'));
document.getElementById('mode-eatout-btn').addEventListener('click', () => setFormMode('eatout'));
document.getElementById('view-list-btn').classList.toggle('active', viewMode === 'list');
document.getElementById('view-grouped-btn').classList.toggle('active', viewMode === 'grouped');
document.getElementById('view-list-btn').addEventListener('click', () => setViewMode('list'));
document.getElementById('view-grouped-btn').addEventListener('click', () => setViewMode('grouped'));
document.getElementById('open-form-btn').addEventListener('click', () => {
  document.getElementById('form-panel').style.display = 'block';
  document.getElementById('open-form-btn').style.display = 'none';
});
document.getElementById('close-form-btn').addEventListener('click', resetForm);
document.getElementById('quick-photo-btn').addEventListener('click', () => document.getElementById('quick-photo-input').click());
document.getElementById('quick-photo-input').addEventListener('change', (e) => {
  const files = e.target.files;
  if (files && files.length) handleQuickAddPhotos(files);
  e.target.value = "";
});
document.getElementById('paste-photo-btn').addEventListener('click', handlePasteButton);
// ページ上で実際にペースト操作をした場合も拾う（フォームが開いていれば写真欄に、閉じていれば「写真だけ追加」と同じ扱いに）
document.addEventListener('paste', (ev) => {
  const files = extractImageFilesFromClipboard(ev.clipboardData);
  if (!files.length) return;
  ev.preventDefault();
  if (document.getElementById('form-panel').style.display === 'block') {
    handleFileSelected(files[0]);
  } else {
    handleQuickAddPhotos(files);
  }
});
document.getElementById('pick-photo-btn').addEventListener('click', () => document.getElementById('file-input').click());
document.getElementById('file-input').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (file) handleFileSelected(file);
});
document.getElementById('save-btn').addEventListener('click', handleSave);
document.getElementById('photo-preview').style.cursor = 'zoom-in';
document.getElementById('photo-preview').addEventListener('click', (ev) => {
  ev.stopPropagation();
  openLightbox(document.getElementById('photo-preview').src);
});
document.getElementById('lightbox').addEventListener('click', closeLightbox);
document.getElementById('lightbox-close').addEventListener('click', (ev) => { ev.stopPropagation(); closeLightbox(); });

document.getElementById('retry-btn').addEventListener('click', loadEntries);
loadEntries();
subscribeRealtime();
</script>
